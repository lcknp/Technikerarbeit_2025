<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>EBM PAPST MONITORING</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="Monitoring_V5.css">
</head>

<body>

<div class="container py-4">

  <!-- Header -->
  <div class="card card-custom mb-4 p-3">
    <div class="d-flex justify-content-between align-items-center flex-wrap">
      <div>
        <h4 class="fw-bold mb-0">Dashboard</h4>
        <small class="text-muted">Letztes Update: <span id="ts"></span></small>
      </div>
      <div class="mt-2 d-flex gap-2">
        <a class="btn btn-dark btn-sm">Dashboard</a>
        <a href="/phpmyadmin" class="btn btn-outline-secondary btn-sm">Datenbank</a>
        <button class="btn btn-secondary btn-sm" id="darkmodeBtn">🌙</button>
      </div>
    </div>
  </div>

  <!-- Top 3 Karten -->
  <div class="row g-3 align-items-stretch">
    <div class="col-md-4">
      <div class="card card-custom p-3 h-100">
        <div class="small text-muted text-uppercase">Air Quality</div>
        <div class="fs-5 fw-bold mt-2" id="airquality-text">–</div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card card-custom p-3 h-100">
        <div class="small text-muted text-uppercase">CO₂</div>
        <div class="fs-1 fw-bold mt-2"><span id="co2">–</span></div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card card-custom p-3 h-100">
        <div class="small text-muted text-uppercase">Indoor Climate</div>
        <div class="fs-5 fw-bold mt-2"><span id="t">–</span> °C</div>
        <small class="text-muted">Feuchte: <span id="h">–</span></small><br>
        <small class="text-muted">Druck: <span id="p">–</span></small>
      </div>
    </div>
  </div>

  <!-- Einheitenkarten (dynamisch generiert) -->
  <div class="row g-3 mt-3" id="einheiten-row">
    <!-- Wird per JS befüllt -->
  </div>

  <!-- Status -->
  <div class="row g-3 mt-3">
    <div class="col-md-4">
      <div class="card card-custom p-3">
        <h6 class="fw-bold mb-3">Status</h6>
        <div class="row mb-1"><div class="col-7">Letztes Update:</div><div class="col-5 text-end"><span id="ts_status">–</span></div></div>
        <div class="row mb-1"><div class="col-7">CO₂ Kategorie:</div><div class="col-5 text-end"><span id="airquality-small">–</span></div></div>
      </div>
    </div>
  </div>

  <!-- CO₂ Chart -->
  <div class="card card-custom p-3 mt-4">
    <h6 class="fw-bold mb-2">CO₂ Verlauf (4 Stunden)</h6>
    <div id="chart-container"><canvas id="co2Chart"></canvas></div>
  </div>

  <!-- Temperatur & PWM Charts (dynamisch generiert) -->
  <div id="charts-container"></div>

</div>

<!-- Custom JavaScript -->
<script src="Monitoring_V5.js"></script>

</body>
</html>
